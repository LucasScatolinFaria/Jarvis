# JARVIS — infraestrutura de dados (usada a partir da FASE 2).
# A Fase 1 (Core + Chat) roda inteiramente em memória e NÃO depende
# deste arquivo. Ele já está pronto para quando a camada de memória
# de longo prazo (packages/database, packages/memory) for conectada.
#
# Uso:
#   docker compose up -d
#
name: jarvis

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis_postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jarvis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jarvis_postgres_data:
  jarvis_redis_data:
